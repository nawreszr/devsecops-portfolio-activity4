name: CI

on:
  push:
    branches: [main, activity5]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: portfolio_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:secretpassword@localhost:5432/portfolio_db
      - run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:secretpassword@localhost:5432/portfolio_db
      - run: npm test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:secretpassword@localhost:5432/portfolio_db

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci

      - name: npm audit (frontend)
        run: npm audit --audit-level=high

      - name: npm audit (backend)
        run: npm audit --audit-level=high
        working-directory: backend

  build-images:
    runs-on: ubuntu-latest
    needs: [frontend-tests, api-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t devsecops-portfolio:${{ github.sha }} .

      - name: Build API image
        run: docker build -t devsecops-api:${{ github.sha }} ./backend

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-portfolio:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Trivy scan api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-api:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
